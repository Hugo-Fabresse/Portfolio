<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: preserves the path for client-side routing.
      // On 404, redirects to index.html with the original path as a query param,
      // which index.html then restores via replaceState.
      var path = window.location.pathname;
      window.location.replace(
        window.location.origin + '/Portfolio/?route=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
